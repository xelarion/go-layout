paths:
  /announcements:
    get:
      consumes:
      - application/json
      description: Retrieves a list of Announcements
      operationId: ListAnnouncements
      parameters:
      - description: 搜索关键字
        in: query
        maxLength: 100
        name: key
        type: string
      - description: Current page number (1-based)
        in: query
        minimum: 1
        name: page
        type: integer
      - description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      - description: 发布时间结束
        in: query
        name: published_at_end
        type: string
      - description: 发布时间开始
        in: query
        name: published_at_start
        type: string
      - description: 发布人ID
        in: query
        name: publisher_id
        type: integer
      - description: Field to sort by, can include table prefix (e.g. "users.id")
        in: query
        name: sort_field
        type: string
      - description: 'Sort direction: asc or desc'
        enum:
        - asc
        - desc
        - ASC
        - DESC
        - ascend
        - descend
        in: query
        name: sort_order
        type: string
      - description: 状态
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/types.Response'
            - properties:
                data:
                  $ref: '#/definitions/types.ListAnnouncementsResp'
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/types.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/types.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/types.Response'
      security:
      - BearerAuth: []
      summary: List Announcements
      tags:
      - announcement
    post:
      consumes:
      - application/json
      description: Creates a new Announcement
      operationId: CreateAnnouncement
      parameters:
      - description: req
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/types.CreateAnnouncementReq'
      produces:
